name: Replace Version Placeholders

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  replace-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Replace %%VERSION%% with GitHub Run ID
        run: |
          find . -name "appmanifest.yml" -type f -exec sed -i "s/%%VERSION%%/${{ github.run_id }}/g" {} +
      
      - name: Verify replacements
        run: |
          echo "=== Updated appmanifest.yml files ==="
          find . -name "appmanifest.yml" -type f -exec echo "File: {}" \; -exec cat {} \;
      
      - name: Commit changes (optional)
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "**/appmanifest.yml"
          git commit -m "Replace version placeholders with run ID ${{ github.run_id }}" || echo "No changes to commit"
          git push
